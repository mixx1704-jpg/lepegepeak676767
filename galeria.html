<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retratos · Abismo dos Ecos</title><style>body{margin:24px;background:#68765c;color:#f4e4b9;font:12px monospace}h1{font-size:22px}select{padding:10px;background:#263e39;color:#f4e4b9;border:1px solid #9aa57e}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}figure{margin:0;text-align:center;padding:12px 0;background:#465b47;border:1px solid #829072}img{width:96px;height:144px;image-rendering:pixelated}figcaption{font-size:11px;margin-top:6px}.subtitle{color:#d1d6b7}</style><h1>32 × 48 · retratos de classe e raça</h1><p class="subtitle">Sprites originais em pixels. Escolha uma classe para comparar suas 18 variações de anatomia e paleta.</p><p><select id="class" aria-label="Classe"></select> <select id="pose" aria-label="Pose"><option value="idle">Em espera</option><option value="step">Passo</option><option value="strike">Golpe</option><option value="cast">Conjuração</option></select></p><main></main><script type="module">import{CLASSES}from './game/data.js';import{RACES}from './game/content.js';import{heroPixels}from './pixel-sprites.js';const cls=document.querySelector('#class'),pose=document.querySelector('#pose');cls.innerHTML=CLASSES.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');const draw=()=>document.querySelector('main').innerHTML=RACES.map(r=>`<figure><img src="${heroPixels(cls.value,r.id,pose.value)}" alt="${r.name}"><figcaption>${r.name}</figcaption></figure>`).join('');cls.onchange=pose.onchange=draw;draw();</script></html>
