name: Deploy Supabase Multiplayer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-function:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: euznkrgwmtjjvdmozxto

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Conferir secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ERRO: adicione SUPABASE_ACCESS_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Publicar Edge Function game
        run: supabase functions deploy game --project-ref "$SUPABASE_PROJECT_ID"
