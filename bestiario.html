<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TUNG e bestiário · v6</title><link rel="stylesheet" href="art-v3.css"><style>body{margin:25px;background:#34463e;color:#eee0b7;font:12px monospace}h1{font-size:22px}h2{margin-top:32px;color:#d1be88}p{line-height:1.7;color:#bac8b4}.models,.mobs,.events,.bosses{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}figure{margin:0;text-align:center;border:1px solid #738269;background:#526548;padding:12px 8px}.models{grid-template-columns:repeat(4,minmax(130px,1fr));max-width:760px}.models .actor-sprite{width:128px;height:192px}.models .weapon-arm{top:14%}.creature-sprite{width:96px;height:96px}.creature-image{width:100%;height:100%;image-rendering:pixelated}.encounter-art{width:128px;height:96px;image-rendering:pixelated}.mobs small{display:block;color:#b9c8a9;font-size:9px;margin-top:5px}figcaption{margin-top:7px;line-height:1.5}.models .preview-step .frame-idle,.models .preview-strike .frame-idle,.models .preview-cast .frame-idle{opacity:0}.models .preview-step .frame-step,.models .preview-strike .frame-strike,.models .preview-cast .frame-cast{opacity:1}.models .preview-strike .weapon-arm{transform:rotate(65deg)}.models .preview-cast .weapon-arm{transform:rotate(-35deg) translateY(-12px)}summary{cursor:pointer;margin-top:8px;color:#d7c18a}details p{font-size:10px;text-align:left}.search{padding:12px;width:min(500px,90%);background:#182d26;border:1px solid #8da47b;color:#eee0b7}a{color:#d4c78f}@media(max-width:550px){.models{grid-template-columns:repeat(2,1fr)}}</style><h1>TUNG · Tung Tung Sahur</h1><p>Corpo de madeira e bastão próprio. <a href="/">Voltar ao jogo</a></p><div class="models"></div><h2>Bestiário · 44 espécies</h2><div class="mobs"></div><h2>Chefes · 80 configurações / 10 famílias visuais</h2><p>Cada ficha mostra sua sequência, efeito adicional, recuperação e segunda fase. Variantes compartilham a família de sprite.</p><label>Buscar chefe <input class="search" id="boss-search" placeholder="Nome, golpe ou elemento"></label><div class="bosses"></div><h2>Encontros especiais</h2><div class="events"></div><script type="module">
import{heroSprite,monsterSprite,eventSprite}from './art-v3.js';import{BOSS_ROSTER}from './game/deep-content.js';import{ENEMY_SPECIES}from './game/expansion.js';import{RARE_ENCOUNTERS}from './game/adventures.js';
document.querySelector('.models').innerHTML=['idle','step','strike','cast'].map((pose,i)=>`<figure class="preview-${pose}">${heroSprite({classId:'barbaro',raceId:'humano',ultra:'TUNG',equipment:{}})}<figcaption>${['Em espera','Passo','Golpe','Conjuração'][i]}</figcaption></figure>`).join('');document.querySelector('.mobs').innerHTML=ENEMY_SPECIES.map(e=>`<figure>${monsterSprite(e)}<figcaption>${e.name}<small>${e.type} · ${e.trick}</small></figcaption></figure>`).join('');
function bosses(query=''){const q=query.toLocaleLowerCase('pt-BR');document.querySelector('.bosses').innerHTML=BOSS_ROSTER.filter(e=>(e.name+' '+e.type+' '+e.mechanic).toLocaleLowerCase('pt-BR').includes(q)).map(e=>`<figure>${monsterSprite({...e,boss:true})}<figcaption>${e.name}<details><summary>Moveset · ${e.type}</summary><p>${e.mechanic}</p><p>Recuperação ${e.speed} UT. Efeito adicional: ${e.moves[0].bonus}.</p></details></figcaption></figure>`).join('')}bosses();document.querySelector('#boss-search').addEventListener('input',e=>bosses(e.target.value));document.querySelector('.events').innerHTML=RARE_ENCOUNTERS.map(e=>`<figure>${eventSprite(e.art)}<figcaption>${e.name}</figcaption></figure>`).join('');
</script></html>
